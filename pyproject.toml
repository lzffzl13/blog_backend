[project]
name = "blog-backend"
version = "0.1.0"
description = "A FastAPI blog backend API"
requires-python = ">=3.12"
dependencies = [
    "annotated-types==0.7.0",
    "bcrypt==5.0.0",
    "email-validator==2.3.0",
    "fastapi==0.115.0",
    "greenlet==3.5.0",
    "pydantic==2.9.0",
    "pydantic-settings==2.14.1",
    "pymysql==1.1.3",
    "pytest==8.4.2",
    "requests==2.32.5",
    "sqlalchemy==2.0.35",
    "uvicorn==0.30.0",
]

[dependency-groups]
dev = [
    "ruff>=0.15.14",
]

[tool.ruff]
line-length = 100
target-version = "py312"

[tool.ruff.lint]
select = ["E", "F", "I", "N", "W", "UP", "B"]
ignore = ["E501", "B008"]

[tool.ruff.format]
quote-style = "double"
indent-style = "space"

[tool.ruff.lint.isort]
known-first-party = ["app"]